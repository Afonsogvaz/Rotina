<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F5FB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0A1127" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Rotina">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="stylesheet" href="style.css">
<title>Rotina</title>
</head>
<body>

<main id="app" aria-live="polite"></main>

<nav id="tabbar" aria-label="Navegação">
  <div class="inner">
    <button class="tab on" data-act="tab" data-tab="today">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.8 2.8L16.2 9.6"/></svg>
      <span>Hoje</span>
    </button>
    <button class="tab" data-act="tab" data-tab="history">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="3.5"/><path d="M3.5 10.2h17M8.2 3v4M15.8 3v4"/></svg>
      <span>Histórico</span>
    </button>
    <button class="tab" data-act="tab" data-tab="analysis">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 19.5h15"/><path d="M7 16v-4.5M12 16V7M17 16v-7"/></svg>
      <span>Análise</span>
    </button>
    <button class="tab" data-act="tab" data-tab="goals">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r=".9" fill="currentColor"/></svg>
      <span>Metas</span>
    </button>
    <button class="tab" data-act="tab" data-tab="data">
      <svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="6.2" rx="7.5" ry="3"/><path d="M4.5 6.2v5.8c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3V6.2M4.5 12v5.8c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3V12"/></svg>
      <span>Dados</span>
    </button>
  </div>
</nav>

<div id="sheet-root"></div>
<div id="toast" role="status"></div>

<noscript>Esta app precisa de JavaScript para funcionar.</noscript>
<script src="core.js"></script>
<script src="rules.js"></script>
<script src="stats.js"></script>
<script src="charts.js"></script>
<script src="views.js"></script>
<script src="sheets.js"></script>
<script src="library.js"></script>
<script src="app.js"></script>
</body>
</html>
